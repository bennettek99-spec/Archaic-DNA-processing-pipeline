[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "archaic-introgression"
version = "0.6.0"
description = "Validated archaeogenetics pipeline for credibility-aware Neanderthal and Denisovan-affinity analysis in AADR genomes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bennett Kuhn" }]
keywords = ["archaeogenetics", "ancient-DNA", "Neanderthal", "introgression", "f-statistics", "AADR"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = ["msprime>=1.3"]
pdf = ["reportlab>=4.0", "pypdf>=4.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pyflakes>=3.0",
    "build>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
archaic-pipeline = "archaic.cli:main"
archaic-highest = "archaic.highest_archaic:main"
archaic-highest-segments = "archaic.highest_archaic_segments:main"
archaic-denisovan = "archaic.denisovan_genome:main"
archaic-admixture-date = "archaic.admixture_dating:main"

[project.urls]
Repository = "https://github.com/bennettek99-spec/Archaic-DNA-processing-pipeline"
Documentation = "https://github.com/bennettek99-spec/Archaic-DNA-processing-pipeline/tree/main/docs"
Issues = "https://github.com/bennettek99-spec/Archaic-DNA-processing-pipeline/issues"
Changelog = "https://github.com/bennettek99-spec/Archaic-DNA-processing-pipeline/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["archaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
