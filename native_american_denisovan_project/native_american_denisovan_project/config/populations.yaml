# Analysis population groups for the Native American Denisovan study.
# Counts are from scripts/01_inventory_aadr.py on AADR v66.p1 1240K (SNP floor 30k).
# These are STARTING definitions; the manifest build resolves real IDs and
# drops relatives / high-contamination / low-SNP individuals per the sample-exclusion rules.

archaic_references:
  Denisovan: {ids: ["Denisova.SG"]}
  Denisovan_diploid: {ids: ["Denisova3.DG"]}
  Denisova11_F1: {ids: ["Denisova11.SG"]}
  Denisova25: {ids: ["Denisova25.SG"]}
  Altai_Neanderthal: {ids: ["AltaiNeanderthal.DG"]}
  Vindija_Neanderthal: {ids: ["VindijaG1_final.SG"]}
  Chagyrskaya_Neanderthal: {ids: ["Chagyrskaya8.DG"]}
  Chimp: {ids: ["Chimp.REF"]}

african_outgroups:
  Mbuti: {pops: ["Mbuti"]}
  Yoruba: {pops: ["Yoruba", "YRI", "YRI-Discovery"]}
  # add Mende / Dinka / Ju_hoan from HO panel for outgroup-robustness checks

west_eurasian_controls:
  French: {pops: ["French"]}
  Sardinian: {pops: ["Sardinian"]}
  Basque: {pops: ["Basque"]}

east_asian_present:
  Han: {pops: ["Han"]}
  Japanese: {pops: ["Japanese"]}
  Dai: {pops: ["Dai"]}
  # Han is the principal East-Asian-Denisovan reference point (S3 denominator)

papuan_australasian:
  Papuan: {pops: ["Papuan"]}
  Australian: {pops: ["Australian"]}
  Nasioi: {pops: ["Nasioi"]}
  Bougainville: {pops: ["Bougainville"]}
  # high positive control (Papuan D_Den ~+3.4%)

philippine_negrito:
  groups: ["Aeta", "Ati", "Mamanwa", "Agta"]   # resolve real pop labels from HO

andamanese:
  groups: ["Onge", "GreatAndaman"]             # resolve real pop labels from HO

american_present_admixed:
  note: "FLAGGED ADMIXED — used only as controls, never for unadmixed inference"
  groups: ["Karitiana", "MXL", "CLM", "PUR", "PEL"]

# Ancient time transect (the historical inference backbone). Each group is a
# (region, date-bin) cohort. SNP floors and relative-dropping are applied at
# manifest build. Key named anchor individuals are listed for verification.
ancient_siberian_ane:
  Upper_Paleolithic_Siberian: {anchor_ids: ["Yana1.SG"]}
  Ancient_Paleo_Siberian: {anchor_ids: ["Kolyma1.SG"]}
  Ancient_North_Eurasian: {anchor_ids: ["MA1.SG", "AfontovaGora2.SG", "AfontovaGora3.AG"]}

ancient_beringian_first_american:
  Ancient_Beringian: {anchor_ids: ["USR1.SG"]}

ancient_americas_by_region:
  Ancient_North_America:    {min_snps: 30000}
  Ancient_Mesoamerica:      {min_snps: 30000}
  Ancient_Caribbean:        {min_snps: 30000}
  Ancient_South_America:    {min_snps: 30000}
  Ancient_Arctic_Beringian: {min_snps: 30000}

ancient_east_asian_jomon:
  Ancient_Jomon: {keywords: ["Jomon"]}
  Ancient_East_Asian: {}

# Exclusion rules (applied at manifest build, never silently)
exclusions:
  - close_relatives: "drop one of any READ kinship > 0.0884 (2nd-cousin) pair within a cohort"
  - low_snps: "snps_1240k < 30000"
  - high_contamination: "contamination estimate above panel high_conf_max_contam_lb (0.02)"
  - unclear_provenance: "no date_bp and no locality (flag, not auto-drop)"
  - duplicates: "master_id collapse to one call set per individual"
