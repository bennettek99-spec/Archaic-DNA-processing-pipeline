name: Scientific or methods question
description: Ask about an estimator, control, limitation, or interpretation boundary.
title: "[Methods]: "
labels: [methods]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Identify the statistic, report, or claim and the evidence you want clarified.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Include relevant papers, sample groups, panel, and command without private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I have not attached private genotype data or restricted AADR files.
          required: true
